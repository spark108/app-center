services:
  db:
    image: mariadb:11.4
    network_mode: host
    restart: unless-stopped
    command: ["--bind-address=127.0.0.1", "--port=${MARIADB_PORT:-3307}"]
    environment:
      MARIADB_DATABASE: spark108
      MARIADB_USER: spark108
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:?Set MARIADB_PASSWORD in .env}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?Set MARIADB_ROOT_PASSWORD in .env}
    volumes:
      - mariadb:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  app:
    build:
      context: .
      args:
        APP_CENTER_SETUP_ORIGIN: ${PUBLIC_ORIGIN:-https://app.godish.ru}
    network_mode: host
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_URLS: "${APP_LISTEN_URLS:-http://127.0.0.1:${APP_PORT:-8080}}"
      PublicOrigin: ${PUBLIC_ORIGIN:-https://app.godish.ru}
      Auth__ClientId: ${ALATHEA_CLIENT_ID:-6e875752c94bfdbf7a33f747325ffbcc}
      Auth__ClientSecret: ${ALATHEA_CLIENT_SECRET:?Set ALATHEA_CLIENT_SECRET in .env}
      Auth__BootstrapSubject: ${ALATHEA_BOOTSTRAP_SUBJECT:-}
      Database__Port: ${MARIADB_PORT:-3307}
      Database__Password: ${MARIADB_PASSWORD}
      DataPath: /data
      ASPNETCORE_TEMP: /data/temp
    volumes:
      - app_data:/data

volumes:
  mariadb:
  app_data:
